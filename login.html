<!DOCTYPE html>
   <html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a2e;
            max-width: 450px;
            margin: 60px auto;
            padding: 25px;
            line-height: 1.6;
            text-align: center; 
        }

        h1 {
            color: #3a5fc8;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 90%;
            max-width: 340px;
            padding: 11px;
            margin: 8px auto;
            display: block;
            border: 1.5px solid #c5d0f5;
            border-radius: 8px;
            text-align: center;
            font-size: 15px;
            background-color: #f8faff;
        }

        input:focus {
            outline: none;
            border-color: #3a5fc8;
            background-color: #ffffff;
        }

        .btn {
            background-color: #3a5fc8;
            color: white;
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 25px;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #2f4eb0;
        }

        .signup-link {
            margin-top: 25px;
            display: block;
        }

        .signup-link a {
            color: #3a5fc8;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            margin-top: 40px;
            color: #3a5fc8;
            text-decoration: none;
        }

        .back-home:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Login</h1>
    <p class="subtitle">Welcome back to A & S REAL ESTATE</p>

    <form action="#" method="post">

        <label for="email">Email or Username:</label>
        <input type="text" id="email" name="email" placeholder="Email or Username" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Password" required>

        <button type="submit" class="btn">Login</button>
    </form>

    <p class="signup-link">
        Don't have an account? <a href="signup.html">Sign Up</a>
    </p>

    <a href="index.html" class="back-home">Back To Home</a>

</body>
</html>
